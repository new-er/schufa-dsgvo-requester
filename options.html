<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>SCHUFA DSGVO Requester – Einstellungen</title>
  <style>
    :root {
      --bg: #fff;
      --fg: #1a1a1a;
      --muted: #555;
      --hint: #777;
      --border: #ddd;
      --surface: #f6f6f6;
      --input-bg: #fff;
      --input-border: #ccc;
      --button-bg: #e7e7e7;
      --button-fg: #1a1a1a;
      --button-hover: #d4d4d4;
      --accent: #06c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a;
        --fg: #e5e5e5;
        --muted: #999;
        --hint: #777;
        --border: #333;
        --surface: #2a2a2a;
        --input-bg: #2a2a2a;
        --input-border: #555;
        --button-bg: #3a3a3a;
        --button-fg: #e5e5e5;
        --button-hover: #4a4a4a;
        --accent: #4a9eff;
      }
    }
    body {
      font: 14px/1.5 system-ui, sans-serif;
      max-width: 520px;
      margin: 32px auto;
      padding: 0 16px;
      background: var(--bg);
      color: var(--fg);
    }
    h1 { font-size: 18px; margin: 0 0 20px; color: var(--fg); }
    h2 { font-size: 14px; margin: 24px 0 12px; color: var(--fg); }
    label { display: block; margin-bottom: 12px; color: var(--fg); }
    label span { display: block; color: var(--muted); }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 6px;
      background: var(--input-bg);
      color: var(--fg);
      border: 1px solid var(--input-border);
      border-radius: 4px;
    }
    .row { display: flex; gap: 12px; }
    .row label { flex: 1; }
    .inline { display: flex; align-items: center; gap: 8px; }
    .inline input { width: auto; }
    button {
      padding: 8px 18px;
      cursor: pointer;
      background: var(--button-bg);
      color: var(--button-fg);
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    button:hover:not(:disabled) { background: var(--button-hover); }
    .status { margin-top: 12px; color: var(--muted); }
    .hint { color: var(--hint); margin: -6px 0 12px; }
  </style>
</head>
<body>
  <h1>SCHUFA DSGVO Auskunftsersuchen</h1>
  <form id="form">
    <label><span>Vorname(n)</span><input name="vorname" required></label>
    <label><span>Nachname(n)</span><input name="nachname" required></label>
    <label><span>Geburtsdatum (TT.MM.JJJJ)</span><input name="geburtsdatum" required></label>
    <label><span>Straße &amp; Nr.</span><input name="strasse" required></label>
    <div class="row">
      <label><span>PLZ</span><input name="plz" required></label>
      <label><span>Wohnort</span><input name="wohnort" required></label>
    </div>
    <label><span>Land</span><input name="land" required></label>
    <label><span>Intervall (Monate)</span><input name="interval_months" type="number" min="1" value="3" required></label>

    <h2>Vorherige Anschrift</h2>
    <label class="inline"><input type="checkbox" id="prev_enabled"> Vorherige Anschrift angeben</label>
    <label><span>Straße &amp; Nr.</span><input name="prev_strasse" disabled></label>
    <div class="row">
      <label><span>PLZ</span><input name="prev_plz" disabled></label>
      <label><span>Wohnort</span><input name="prev_wohnort" disabled></label>
    </div>
    <label><span>Land</span><input name="prev_land" disabled></label>

    <h2>Empfänger</h2>
    <label><span>An</span><input name="to_addr"></label>
    <label><span>CC (optional)</span><input name="cc_addr"></label>
    <label><span>BCC (optional)</span><input name="bcc_addr"></label>
    <p class="hint">Mehrere Adressen mit Komma trennen.</p>

    <h2>Benachrichtigungen</h2>
    <label class="inline"><input type="checkbox" id="notify_enabled" checked> Erinnerung anzeigen</label>
    <label><span>Wiederholung</span>
      <select id="notify_repeat">
        <option value="once">Einmalig (am Fälligkeitstag)</option>
        <option value="hourly">Stündlich</option>
        <option value="daily">Täglich</option>
        <option value="weekly">Wöchentlich</option>
      </select>
    </label>

    <label><span>Letzte Anfrage</span><input type="date" name="last_sent"></label>
    <button type="submit">Speichern</button>
    <div class="status" id="due"></div>
    <div class="status" id="status"></div>
  </form>
  <script src="letter.js"></script>
  <script src="options.js"></script>
</body>
</html>
