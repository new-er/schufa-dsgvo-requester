<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>SCHUFA DSGVO Requester</title>
  <style>
    :root {
      --bg: #fff;
      --fg: #1a1a1a;
      --muted: #555;
      --border: #ddd;
      --surface: #f6f6f6;
      --button-bg: #e7e7e7;
      --button-fg: #1a1a1a;
      --button-hover: #d4d4d4;
      --accent: #06c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a;
        --fg: #e5e5e5;
        --muted: #999;
        --border: #333;
        --surface: #2a2a2a;
        --button-bg: #3a3a3a;
        --button-fg: #e5e5e5;
        --button-hover: #4a4a4a;
        --accent: #4a9eff;
      }
    }
    body {
      font: 13px/1.4 system-ui, sans-serif;
      width: 260px;
      margin: 0;
      padding: 12px;
      background: var(--bg);
      color: var(--fg);
    }
    h1 { font-size: 14px; margin: 0 0 10px; }
    button {
      width: 100%;
      padding: 8px;
      cursor: pointer;
      background: var(--button-bg);
      color: var(--button-fg);
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    #open { font-weight: 600; margin-bottom: 8px; }
    #settings {
      width: auto;
      background: none;
      border: none;
      color: var(--accent);
      text-decoration: underline;
      padding: 4px;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button:hover:not(:disabled) { background: var(--button-hover); }
    .status { color: var(--muted); margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>SCHUFA DSGVO Auskunftsersuchen</h1>
  <div class="status" id="status"></div>
  <button id="open">E-Mail öffnen</button>
  <button id="settings">Einstellungen</button>
  <script src="letter.js"></script>
  <script src="popup.js"></script>
</body>
</html>
